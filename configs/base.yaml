seed: 42
device: "cuda"
num_workers: 4

data:
  raw_root: "/home/kanemoda/MedicalFL/data/raw"
  processed_root: "/home/kanemoda/MedicalFL/data/processed"
  mitbih_subdir: "mitbih"
  ptbxl_subdir: "ptbxl"

mitbih:
  sample_rate: 360
  window_samples: 250
  num_classes: 5
  class_names: ["N", "S", "V", "F", "Q"]

ptbxl:
  sample_rate: 100
  window_samples: 1000
  label_mode: "binary"
  num_classes: 2
  class_names: ["Normal", "Abnormal"]
  class_names_5class: ["NORM", "MI", "STTC", "CD", "HYP"]
  lead: "II"

training:
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"

federation:
  num_clients: 5
  rounds: 50
  local_epochs: 5
