_base_: "federated_base.yaml"
dataset: "ptbxl"
model: "cnn1d"

ptbxl:
  label_mode: "binary"
  num_classes: 2
  class_names: ["Normal", "Abnormal"]

training:
  augment: false
  batch_size: 96
  num_workers: 4
  pin_memory: true
  lr: 0.001
  weight_decay: 0.0005

federation:
  rounds: 30
  local_epochs: 5
  num_clients: 5
  proximal_mu: 0.01
  fedperf_alpha: 0.5
  fedbn_central_eval: "client_avg"

sweep:
  seed: 42
  partitions:
    - name: "iid"
      fn: "iid"
      kwargs: {}
    - name: "label_skew_c1"
      fn: "label_skew"
      kwargs: {classes_per_client: 1}
    - name: "dirichlet_a01"
      fn: "dirichlet"
      kwargs: {alpha: 0.1}
  aggregations:
    - "fedavg"
    - "fedprox"
    - "fedbn"
    - "fedperf"
